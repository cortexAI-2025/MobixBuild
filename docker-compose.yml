version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - builds:/builds
    environment:
      PORT: "3000"
      BUILDS_DIR: "/builds"
      SCRIPTS_DIR: "/scripts"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  builds:
    driver: local
