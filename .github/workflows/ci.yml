name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:

  # ── Job 1: Validate scripts & server ─────────────────────────────────────────
  validate:
    name: Validate pipeline scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check – build.sh
        run: |
          bash -n scripts/build.sh
          echo "✓ scripts/build.sh"

      - name: Syntax check – server/index.js
        run: |
          node --check server/index.js
          echo "✓ server/index.js"

      - name: Verify required files exist
        run: |
          set -e
          declare -a required=(
            "scripts/build.sh"
            "server/index.js"
            "server/package.json"
            "Dockerfile"
            "docker-compose.yml"
            "android-client/settings.gradle.kts"
            "android-client/app/build.gradle.kts"
            "android-client/gradle/wrapper/gradle-wrapper.properties"
          )
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then echo "✓ $f"; else echo "✗ MISSING: $f"; exit 1; fi
          done

  # ── Job 2: Build Android client (debug APK + release AAB) ────────────────────
  build-apk:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fix root cause #1: point setup-gradle at android-client/ so the action
      # finds gradle-wrapper.properties and doesn't fail with "No file matched".
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          build-root-directory: android-client   # ← key fix
          cache-read-only: false

      # gradle-wrapper.jar is a binary; regenerate it from the installed Gradle.
      - name: Regenerate Gradle wrapper JAR
        working-directory: android-client
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      # ── Quick (debug) APK ─────────────────────────────────────────────────────
      - name: Build with Gradle
        working-directory: android-client
        run: |
          # --stacktrace : Donne plus de détails sur l'erreur
          # --info       : Affiche tout le processus, pas seulement les erreurs
          # --no-daemon  : Sur GitHub Actions le daemon Gradle plante souvent,
          #                le désactiver rend le build beaucoup plus stable
          ./gradlew assembleDebug --stacktrace --info --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            --max-workers=1

      - name: Show build logs on failure
        working-directory: android-client
        # Affiche les logs de build (s'ils existent) pour voir ce qui s'est passé
        if: failure()
        run: |
          find app/build/outputs -name "*.log" 2>/dev/null | xargs cat 2>/dev/null || true
          find . -path "*/build/tmp/*" -name "*.log" 2>/dev/null | xargs cat 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Production (signed release APK) ──────────────────────────────────────
      - name: Generate CI keystore
        run: |
          keytool -genkeypair \
            -keystore android-client/app/ci.keystore \
            -alias     release \
            -keyalg    RSA \
            -keysize   2048 \
            -validity  365 \
            -storepass ci_password \
            -keypass   ci_password \
            -dname     "CN=CI, OU=CI, O=MobixBuild, L=CI, ST=CI, C=US" \
            -noprompt

      - name: Build signed release APK
        working-directory: android-client
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/android-client/app/ci.keystore" \
            "-Pandroid.injected.signing.store.password=ci_password" \
            "-Pandroid.injected.signing.key.alias=release" \
            "-Pandroid.injected.signing.key.password=ci_password"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-client/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ── Store (AAB) ────────────────────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android-client
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/android-client/app/ci.keystore" \
            "-Pandroid.injected.signing.store.password=ci_password" \
            "-Pandroid.injected.signing.key.alias=release" \
            "-Pandroid.injected.signing.key.password=ci_password"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android-client/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # ── Job 3: Docker build + smoke test ─────────────────────────────────────────
  docker:
    name: Docker build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag mobixbuild-api:ci .

      - name: Smoke-test container
        run: |
          docker run -d \
            --name mbci \
            -p 13000:3000 \
            -e BUILDS_DIR=/tmp/builds \
            -e SCRIPTS_DIR=/scripts \
            mobixbuild-api:ci

          for i in $(seq 1 15); do
            if curl -sf http://localhost:13000/health > /dev/null 2>&1; then
              echo "✓ API healthy"
              docker stop mbci
              exit 0
            fi
            sleep 2
          done

          echo "✗ API never became healthy"
          docker logs mbci
          docker stop mbci
          exit 1

  # ── Job 4: Build summary ──────────────────────────────────────────────────────
  summary:
    name: Android Build Result
    runs-on: ubuntu-latest
    needs: [validate, build-apk, docker]
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## Android Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ needs.build-apk.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`app-debug-apk\` — debug APK (Quick mode)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`app-release-apk\` — signed release APK (Production mode)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`app-release-aab\` — release bundle (Store mode)" >> "$GITHUB_STEP_SUMMARY"
