name: Build Android APK

on:
  push:
    branches: [ "main" ] # Déclenche le build quand vous poussez sur la branche 'main'

jobs:
  build:
    runs-on: ubuntu-latest # Utilise un serveur Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        working-directory: android-client
        # On force l'affichage complet et on désactive le daemon pour la stabilité
        run: ./gradlew assembleDebug --stacktrace --no-daemon --info

      - name: Show readable errors on failure
        working-directory: android-client
        if: failure()
        run: |
          echo "════════════════════════════════════════"
          echo "           ERREURS DE COMPILATION"
          echo "════════════════════════════════════════"
          # Extrait uniquement les lignes d'erreur/warning du log Gradle
          ./gradlew assembleDebug --no-daemon 2>&1 \
            | grep -E "^(error:|warning:|FAILURE|FAILED|Exception|Caused by|> Task|What went wrong)" \
            || true
          echo "════════════════════════════════════════"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
