name: Build Android APK

on:
  push:
    branches: [ "main", "claude/android-saas-build-backend-b4p0Z" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installe Gradle 8.4 et pointe sur android-client/ pour trouver
      # gradle-wrapper.properties (évite l'erreur "No file matched")
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          build-root-directory: android-client
          cache-read-only: false

      - name: Make gradlew executable
        working-directory: android-client
        run: chmod +x gradlew

      - name: Clean Gradle cache
        working-directory: android-client
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        working-directory: android-client
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
