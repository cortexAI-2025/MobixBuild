name: Build Android APK

on:
  push:
    branches: [ "main", "claude/android-saas-build-backend-b4p0Z" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installe Gradle 8.4 et pointe sur android-client/ pour trouver
      # gradle-wrapper.properties (évite l'erreur "No file matched")
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          build-root-directory: android-client
          cache-read-only: false

      - name: Regenerate wrapper JAR
        working-directory: android-client
        run: |
          gradle wrapper --gradle-version 8.4 --no-validate-url
          chmod +x gradlew

      - name: Clean Gradle cache
        working-directory: android-client
        run: gradle clean --no-daemon

      - name: Build debug APK
        working-directory: android-client
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Extract real error on failure
        if: failure()
        run: |
          echo "════════ CAUSE RÉELLE ════════"
          grep -A 10 "Caused by:" /tmp/gradle-build.log | head -60 || true
          echo "════════ WHAT WENT WRONG ════════"
          grep -A 10 "What went wrong" /tmp/gradle-build.log | head -40 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
