name: Build Android APK

on:
  push:
    branches: [ "main" ] # Déclenche le build quand vous poussez sur la branche 'main'

jobs:
  build:
    runs-on: ubuntu-latest # Utilise un serveur Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew assembleDebug # La commande pour créer l'APK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk # Où trouver l'APK généré
