name: Build Android APK

on:
  push:
    branches: [ "main" ] # Déclenche le build quand vous poussez sur la branche 'main'

jobs:
  build:
    runs-on: ubuntu-latest # Utilise un serveur Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Gradle
        working-directory: android-client
        run: ./gradlew clean

      - name: Build with Gradle
        working-directory: android-client
        # On utilise --no-daemon pour éviter les crashs mémoire
        # On ajoute --stacktrace pour voir l'erreur réelle en cas de crash
        # On ajoute --info pour avoir des logs détaillés
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
