[versions]
agp             = "8.3.0"
kotlin          = "1.9.22"
coreKtx         = "1.12.0"
lifecycleRuntime= "2.7.0"
activityCompose = "1.8.2"
appcompat       = "1.6.1"
composeBom      = "2024.02.00"
navCompose      = "2.7.6"
retrofit        = "2.9.0"
okhttp          = "4.12.0"
coroutines      = "1.7.3"
gson            = "2.10.1"

[libraries]
androidx-core-ktx          = { group = "androidx.core",          name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-activity-compose  = { group = "androidx.activity",      name = "activity-compose",      version.ref = "activityCompose" }
androidx-appcompat         = { group = "androidx.appcompat",     name = "appcompat",             version.ref = "appcompat" }
compose-bom                = { group = "androidx.compose",       name = "compose-bom",           version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui",    name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling         = { group = "androidx.compose.ui",    name = "ui-tooling" }
nav-compose                = { group = "androidx.navigation",     name = "navigation-compose",    version.ref = "navCompose" }
retrofit                   = { group = "com.squareup.retrofit2",  name = "retrofit",              version.ref = "retrofit" }
retrofit-gson              = { group = "com.squareup.retrofit2",  name = "converter-gson",        version.ref = "retrofit" }
okhttp                     = { group = "com.squareup.okhttp3",    name = "okhttp",                version.ref = "okhttp" }
okhttp-logging             = { group = "com.squareup.okhttp3",    name = "logging-interceptor",   version.ref = "okhttp" }
kotlinx-coroutines         = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android", version.ref = "coroutines" }
gson                       = { group = "com.google.code.gson",    name = "gson",                  version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
